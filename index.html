<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hear It, Spell It</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Work+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF8F1; --ink:#23302B; --pencil:#D6A94A; --leaf:#4C7A5E; --clay:#B4573F;
    --card:#FFFFFF; --line: rgba(35,48,43,0.12);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1B2420; --ink:#F2EFE6; --card:#242F29; --line: rgba(242,239,230,0.14);
    }
  }
  :root[data-theme="dark"]{
    --paper:#1B2420; --ink:#F2EFE6; --card:#242F29; --line: rgba(242,239,230,0.14);
  }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
  body{
    height:100%; margin:0; background:var(--paper); color:var(--ink);
    font-family:'Work Sans', -apple-system, sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .stage{ width:100%; max-width:480px; }
  .eyebrow{ font-family:'Fraunces', Georgia, serif; font-size:15px; font-weight:500; color:var(--leaf); margin:0 0 6px; }
  h1{ font-family:'Fraunces', Georgia, serif; font-weight:700; font-size:clamp(26px,6vw,36px); margin:0 0 20px; line-height:1.15; }
  .progress{ display:flex; gap:6px; margin-bottom:28px; flex-wrap:wrap; }
  .dot{ width:10px; height:10px; border-radius:50%; background:var(--line); transition:background .2s; }
  .dot.done{ background:var(--leaf); }
  .dot.current{ background:var(--pencil); }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    padding:32px 28px; box-shadow:0 1px 2px rgba(0,0,0,0.04);
  }
  .playrow{ display:flex; align-items:center; gap:14px; margin-bottom:24px; }
  .playbtn{
    width:60px; height:60px; border-radius:50%; border:none; background:var(--leaf); color:white;
    font-size:22px; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    transition:transform .12s;
  }
  .playbtn:hover{ transform:scale(1.05); }
  .playbtn:active{ transform:scale(0.96); }
  .playhint{ font-size:14px; color:var(--ink); opacity:0.65; }
  .boxwrap{
    display:flex; gap:8px; flex-wrap:wrap; justify-content:center;
  }
  .letterbox{
    width:40px; height:48px; text-align:center; font-size:22px; font-weight:700;
    font-family:'Work Sans', sans-serif; border:none; border-bottom:3px solid var(--line);
    background:transparent; color:var(--ink); outline:none; transition:border-color .15s;
    text-transform:lowercase; padding:0;
  }
  .letterbox:focus{ border-color:var(--pencil); }
  .letterbox.filled{ border-color:var(--pencil); }
  .letterbox.correct{ border-color:var(--leaf); background:rgba(76,122,94,0.12); }
  .letterbox.wrong{ border-color:var(--clay); background:rgba(180,87,63,0.12); }
  .letterbox:disabled{ opacity:1; }
  @media (max-width:420px){
    .letterbox{ width:32px; height:42px; font-size:18px; }
    .boxwrap{ gap:6px; }
  }
  .submit{
    width:100%; margin-top:14px; padding:14px; font-size:16px; font-weight:700; font-family:'Work Sans', sans-serif;
    border:none; border-radius:10px; background:var(--ink); color:var(--paper); cursor:pointer;
  }
  .submit:active{ transform:scale(0.99); }
  .feedback{ min-height:24px; margin-top:16px; font-size:15px; font-weight:500; }
  .feedback.correct{ color:var(--leaf); }
  .feedback.wrong{ color:var(--clay); }
  .done-screen{ text-align:center; }
  .done-screen .big{ font-family:'Fraunces', Georgia, serif; font-size:40px; font-weight:700; margin:0 0 10px; }
  .restart{
    padding:12px 24px; border-radius:10px; border:2px solid var(--ink);
    background:transparent; color:var(--ink); font-weight:700; cursor:pointer; font-family:'Work Sans', sans-serif;
  }
  .done-actions{ display:flex; gap:10px; justify-content:center; margin-top:18px; flex-wrap:wrap; }
  .hidden{ display:none; }
  .menu-list{ display:flex; flex-direction:column; gap:10px; }
  .menu-item{
    display:block; width:100%; text-align:left; padding:16px 18px; border-radius:12px;
    border:1px solid var(--line); background:transparent; color:var(--ink);
    font-family:'Work Sans', sans-serif; font-size:17px; font-weight:600; cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .menu-item:hover{ border-color:var(--pencil); background:rgba(214,169,74,0.08); }
  .menu-item .count{ display:block; font-size:13px; font-weight:400; opacity:0.6; margin-top:2px; }
  .backlink{
    background:none; border:none; color:var(--ink); opacity:0.6; font-size:14px; cursor:pointer;
    padding:0; margin-bottom:14px; font-family:'Work Sans', sans-serif; text-decoration:underline;
  }
</style>
</head>
<body>
<div class="stage">
  <p class="eyebrow" id="eyebrow">Spelling practice</p>
  <h1 id="heading">Choose a word set</h1>
  <div class="progress hidden" id="progress"></div>

  <div class="card" id="menuCard">
    <div class="menu-list" id="menuList"></div>
  </div>

  <div class="card hidden" id="quizCard">
    <button class="backlink" id="backFromQuiz">&larr; Back to word sets</button>
    <div class="playrow">
      <button class="playbtn" id="playBtn" aria-label="Play word">&#128266;</button>
      <span class="playhint">Tap to hear the word (as many times as you need)</span>
    </div>
    <div class="boxwrap" id="boxWrap"></div>
    <button class="submit" id="submitBtn">Check</button>
    <p class="feedback" id="feedback"></p>
  </div>

  <div class="card done-screen hidden" id="doneCard">
    <p class="big">All done!</p>
    <p>You spelled every word correctly.</p>
    <div class="done-actions">
      <button class="restart" id="restartBtn">Practice again</button>
      <button class="restart" id="menuFromDone">Back to word sets</button>
    </div>
  </div>
</div>

  let order = [];
  let current = 0;
  let wasWrong = false;
  let needsRetype = false;
  let phase = 'main';
  let revisitQueue = [];
  let unitName = '';

  const eyebrowEl = document.getElementById('eyebrow');
  const headingEl = document.getElementById('heading');
  const progressEl = document.getElementById('progress');
  const feedbackEl = document.getElementById('feedback');
  const boxWrap = document.getElementById('boxWrap');
  const menuCard = document.getElementById('menuCard');
  const quizCard = document.getElementById('quizCard');
  const doneCard = document.getElementById('doneCard');
  const menuList = document.getElementById('menuList');
  let boxes = [];
  const audioEl = new Audio();

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  function speak(word){
    const data = AUDIO_DATA[word];
    if(data){
      audioEl.pause();
      audioEl.currentTime = 0;
      audioEl.src = 'data:audio/mpeg;base64,' + data;
      audioEl.play().catch(() => {});
    } else if('speechSynthesis' in window){
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(word);
      utter.rate = 0.85;
      window.speechSynthesis.speak(utter);
    }
  }

  function renderMenu(){
    menuList.innerHTML = '';
    Object.keys(UNITS).forEach(name => {
      const btn = document.createElement('button');
      btn.className = 'menu-item';
      btn.innerHTML = name + '<span class="count">' + UNITS[name].length + ' words</span>';
      btn.addEventListener('click', () => selectUnit(name));
      menuList.appendChild(btn);
    });
  }

  function showMenu(){
    if(window.speechSynthesis) window.speechSynthesis.cancel();
    audioEl.pause();
    menuCard.classList.remove('hidden');
    quizCard.classList.add('hidden');
    doneCard.classList.add('hidden');
    progressEl.classList.add('hidden');
    eyebrowEl.textContent = 'Spelling practice';
    headingEl.textContent = 'Choose a word set';
  }

  function selectUnit(name){
    unitName = name;
    menuCard.classList.add('hidden');
    progressEl.classList.remove('hidden');
    headingEl.textContent = 'Listen, then spell it';
    start();
  }

  function renderProgress(){
    progressEl.innerHTML = '';
    order.forEach((_, i) => {
      const d = document.createElement('div');
      d.className = 'dot' + (i < current ? ' done' : i === current ? ' current' : '');
      progressEl.appendChild(d);
    });
  }

  function buildBoxes(length){
    boxWrap.innerHTML = '';
    boxes = [];
    for(let i=0;i<length;i++){
      const b = document.createElement('input');
      b.type = 'text';
      b.maxLength = 1;
      b.className = 'letterbox';
      b.autocomplete = 'off';
      b.autocapitalize = 'off';
      b.spellcheck = false;
      b.inputMode = 'text';
      b.dataset.index = i;
      boxWrap.appendChild(b);
      boxes.push(b);
    }
    boxes.forEach((box, i) => {
      box.addEventListener('input', () => {
        box.value = box.value.replace(/[^a-zA-Z]/g, '').toLowerCase();
        box.classList.toggle('filled', box.value.length > 0);
        if(box.value){
          const next = nextEditable(i);
          if(next !== -1) boxes[next].focus();
          else if(boxes.every(b => b.value.length > 0)) checkAnswer();
        }
      });
      box.addEventListener('keydown', (e) => {
        if(e.key === 'Backspace' && !box.value){
          const prev = prevEditable(i);
          if(prev !== -1) boxes[prev].focus();
        }
        if(e.key === 'Enter') checkAnswer();
      });
    });
  }

  function nextEditable(from){
    for(let i=from+1;i<boxes.length;i++){ if(!boxes[i].disabled) return i; }
    return -1;
  }
  function prevEditable(from){
    for(let i=from-1;i>=0;i--){ if(!boxes[i].disabled) return i; }
    return -1;
  }

  function loadWord(){
    feedbackEl.textContent = '';
    feedbackEl.className = 'feedback';
    wasWrong = false;
    needsRetype = false;
    renderProgress();
    buildBoxes(order[current].length);
    setTimeout(() => speak(order[current]), 250);
    setTimeout(() => boxes[0] && boxes[0].focus(), 260);
  }

  function advance(){
    current++;
    if(current >= order.length){
      if(phase === 'main' && revisitQueue.length > 0){
        phase = 'revisit';
        order = shuffle(revisitQueue);
        revisitQueue = [];
        current = 0;
        eyebrowEl.textContent = unitName + ' \u2014 second try';
        loadWord();
      } else {
        quizCard.classList.add('hidden');
        doneCard.classList.remove('hidden');
      }
    } else {
      loadWord();
    }
  }

  function checkAnswer(){
    const correct = order[current].toLowerCase();
    const given = boxes.map(b => b.value.toLowerCase()).join('');
    if(given === correct){
      boxes.forEach(b => { b.disabled = true; b.classList.add('correct'); b.classList.remove('wrong'); });

      if(needsRetype){
        feedbackEl.textContent = 'Nice, locked it in! Next word\u2026';
        feedbackEl.className = 'feedback correct';
        if(phase === 'main') revisitQueue.push(order[current]);
        setTimeout(advance, 700);
      } else if(wasWrong && phase === 'main'){
        feedbackEl.textContent = 'Fixed it! Now type it again from memory.';
        feedbackEl.className = 'feedback correct';
        needsRetype = true;
        setTimeout(() => {
          buildBoxes(correct.length);
          speak(order[current]);
          boxes[0].focus();
        }, 900);
      } else {
        feedbackEl.textContent = 'Correct! Next word coming up\u2026';
        feedbackEl.className = 'feedback correct';
        setTimeout(advance, 700);
      }
    } else {
      wasWrong = true;
      feedbackEl.textContent = 'Some letters are right \u2014 fix the red ones and try again.';
      feedbackEl.className = 'feedback wrong';
      let firstWrong = -1;
      boxes.forEach((b, i) => {
        const letterOk = b.value.toLowerCase() === correct[i];
        b.classList.remove('filled');
        if(letterOk){
          b.classList.add('correct'); b.classList.remove('wrong');
          b.disabled = true;
        } else {
          b.classList.add('wrong'); b.classList.remove('correct');
          b.disabled = false; b.value = '';
          if(firstWrong === -1) firstWrong = i;
        }
      });
      if(firstWrong !== -1) boxes[firstWrong].focus();
    }
  }

  document.getElementById('playBtn').addEventListener('click', () => speak(order[current]));
  document.getElementById('submitBtn').addEventListener('click', checkAnswer);
  document.getElementById('restartBtn').addEventListener('click', start);
  document.getElementById('backFromQuiz').addEventListener('click', showMenu);
  document.getElementById('menuFromDone').addEventListener('click', showMenu);

  function start(){
    order = shuffle(UNITS[unitName]);
    current = 0;
    phase = 'main';
    revisitQueue = [];
    eyebrowEl.textContent = unitName;
    doneCard.classList.add('hidden');
    quizCard.classList.remove('hidden');
    loadWord();
  }

  renderMenu();
  showMenu();
</script>
